{% extends "base.html" %}

{% block title %}Contact - Sanaj{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Welcome to Contact Me</h1>
    <br>
</div>
<!-- DOWNLOAD BUTTONS -->
 <br>
 <div class="row g-3 mb-4">
    <div class="col-md-6">
        <a href="{{ url_for('static', filename='docs/Resume.pdf') }}" download
           class="text-decoration-none">
            <div class="p-3 text-white rounded shadow-sm"
                 style="background: linear-gradient(135deg, #0d6efd, #0056d2);">
                <h5 class="m-0">📄 Download Resume</h5>
            </div>
        </a>
    </div>




<!-- Contact Form -->
 <section id="contact">
    <h2>Write your message here.</h2>
    <form id="contact-form" method="post" action="{{ url_for('contact') }}">
        <!-- NAME -->
        <div class="mb-3">
            <label for="name" class="form-label">Name:</label>
            <input type="text" class="form-control" name="name" required>
        </div>
        <!-- EMAIL -->
        <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" name="email" required>
        </div>
        <!-- MESSAGE -->
        <div class="mb-3">
            <label for="message" class="form-label">Message:</label>
            <textarea name="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
 </section>

 {% endblock %}
