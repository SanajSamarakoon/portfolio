{% extends "base.html" %}
{% block title %}{{ project.title }} - My Portfolio{% endblock %}

{% block content %}
<section class="container mt-5">
    <h1>{{ project.title }}</h1>
    <img src="{{ url_for('static', filename='images/' + project.image) }}" class="img-fluid mb-4" alt="{{ project.title }}">
    <div class="project-overlay">
        <div class="project-links">
            <a href="{{ project.demo_url }}" class="btn btn-primary btn-sm me-2" target="_blank">View Demo</a>
            <a href="{{ project.github_url }}" class="btn btn-outline-light btn-sm" target="_blank">GitHub</a>
        </div>
    </div>
    <p>{{ project.description }}</p>
    <div class="tech-stack mb-4">
        {% for tech_stack in project.tech_stack %}
        <span class="badge bg-primary">{{ tech_stack }}</span>
        {% endfor %}
    </div>
    <div class="mb-4">
        <a href="{{ url_for('projects') }}" class="btn btn-secondary">Back to Projects</a>
    </div>
</section>
{% endblock %}
